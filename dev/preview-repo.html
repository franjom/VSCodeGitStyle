<!DOCTYPE html>
<!--
  Dev harness for the Git Repository window. Loads the real media/repo.css and
  media/repo.js with a stubbed webview API and a captured model, so the commit
  graph can be inspected without launching an Extension Development Host.
  Not shipped as part of the extension's runtime.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Git Repository - preview</title>
<link href="../media/codicon.css" rel="stylesheet">
<link href="../media/shell.css" rel="stylesheet">
<link href="../media/repo.css" rel="stylesheet">
<style>
  /* Approximation of VS Code's Dark Modern tokens. */
  :root {
    --vscode-font-family: "Segoe UI", system-ui, sans-serif;
    --vscode-font-size: 13px;
    --vscode-editor-font-family: Consolas, "Courier New", monospace;
    --vscode-foreground: #cccccc;
    --vscode-editor-background: #1f1f1f;
    --vscode-panel-border: #2b2b2b;
    --vscode-descriptionForeground: #9d9d9d;
    --vscode-input-background: #313131;
    --vscode-input-foreground: #cccccc;
    --vscode-input-border: #3c3c3c;
    --vscode-focusBorder: #0078d4;
    --vscode-textLink-foreground: #4daafc;
    --vscode-textLink-activeForeground: #6cb8ff;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-list-activeSelectionBackground: #04395e;
    --vscode-list-activeSelectionForeground: #ffffff;
    --vscode-badge-background: #0078d4;
    --vscode-badge-foreground: #ffffff;
    --vscode-progressBar-background: #0078d4;
    --vscode-editorGroupHeader-tabsBackground: #181818;
    --vscode-menu-background: #1f1f1f;
    --vscode-menu-foreground: #cccccc;
    --vscode-menu-border: #454545;
    --vscode-menu-selectionBackground: #04395e;
    --vscode-menu-selectionForeground: #ffffff;
    --vscode-menu-separatorBackground: #454545;
    --vscode-symbolIcon-folderForeground: #dcb67a;
  }
</style>
</head>
<body>
<div id="root" class="repo-shell"></div>
<div id="menu" class="context-menu" hidden></div>

<script src="./preview-repo-model.js"></script>
<script>
  // ?rows=N repeats the captured local history until it is N commits long, so
  // row virtualization can be exercised without capturing a huge repository.
  (function () {
    var want = parseInt(new URLSearchParams(location.search).get('rows'), 10);
    if (!want) {
      return;
    }
    var graph = window.__VSG_REPO_MODEL.graph;
    var local = graph.rows.filter(function (r) { return r.group === 'local'; });
    var grown = [];
    for (var i = 0; grown.length < want; i++) {
      var source = local[i % local.length];
      if (i < local.length) {
        grown.push(source);
        continue;
      }
      var clone = JSON.parse(JSON.stringify(source));
      // Unique in the first seven characters, so the short hash in the ID
      // column identifies the row and tools/preview-check.js can tell which
      // commits are on screen.
      clone.commit.hash = ('000000' + i.toString(16)).slice(-7) + clone.commit.hash.slice(7);
      clone.commit.shortHash = clone.commit.hash.slice(0, 7);
      clone.commit.subject = source.commit.subject + ' (' + i + ')';
      // Only the captured rows carry refs and HEAD; cloning those would put the
      // same branch chip on hundreds of commits.
      clone.commit.refs = [];
      clone.isHead = false;
      grown.push(clone);
    }
    graph.rows = graph.rows.filter(function (r) { return r.group === 'incoming'; }).concat(grown);
  })();
</script>
<script>
  let stored = {};
  window.acquireVsCodeApi = function () {
    return {
      getState: function () { return stored; },
      setState: function (next) { stored = next; },
      postMessage: function (message) {
        console.log('[preview] postMessage', message);
        if (message.type === 'ready' || message.type === 'refresh') {
          window.dispatchEvent(
            new MessageEvent('message', { data: { type: 'model', model: window.__VSG_REPO_MODEL } })
          );
        }
        if (message.type === 'selectCommit') {
          // Synthesize details from the captured row so the pane is usable in
          // the preview; the real thing reads them from git.
          var rows = window.__VSG_REPO_MODEL.graph.rows;
          var row = null;
          for (var i = 0; i < rows.length; i++) {
            if (rows[i].commit.hash === message.hash) { row = rows[i]; break; }
          }
          var c = row && row.commit;
          var slug = c ? c.author.toLowerCase().replace(/[^a-z]+/g, '.') : 'someone';
          window.dispatchEvent(new MessageEvent('message', { data: {
            type: 'commitDetails',
            details: c ? {
              hash: c.hash,
              shortHash: c.shortHash,
              parents: c.parents,
              refs: c.refs,
              author: { name: c.author, email: slug + '@example.com', date: c.date },
              committer: { name: c.author, email: slug + '@example.com', date: c.date },
              subject: c.subject,
              body: 'Preview harness: this body and file list are synthesized.',
              files: [
                { status: 'M', path: 'Mcs.Skzz.Api/Controllers/Api/WidgetSettings/WidgetSettingsController.cs' },
                { status: 'M', path: 'Mcs.Skzz.Api/Controllers/Api/WidgetSettings/WidgetSettingsModel.cs' },
                { status: 'A', path: 'Mcs.Skzz.Data/Repositories/WidgetSettingRepository.cs' },
                { status: 'M', path: 'Mcs.Skzz.Data/Migrations/20260911_AddWidgetSettings.sql' },
                { status: 'D', path: 'Mcs.Skzz.Common/Helpers/DateHelper.cs' },
                { status: 'M', path: 'Mcs.Skzz.Common/Helpers/StringHelper.cs' },
                { status: 'R', path: 'Mcs.Medicus.Spa/src/styles/theme.scss', origPath: 'Mcs.Medicus.Spa/src/theme.scss' },
                { status: 'M', path: 'Mcs.Medicus.Spa/src/business/core/services/SessionVrstePrijema.ts' },
                { status: 'M', path: 'Mcs.Medicus.Spa/src/business/module.common/viewmodels/PosjetNoviViewModel.ts' },
                { status: 'M', path: 'Mcs.Medicus.Spa/src/index.html' },
                { status: 'A', path: 'tools/deploy.py' },
                { status: 'M', path: 'Directory.Build.props' },
                { status: 'M', path: 'package.json' },
                { status: 'M', path: 'Mcs.Skzz.Data/Generated/Model.designer.cs' }
              ],
              truncated: false,
              isMerge: c.parents.length > 1
            } : null
          } }));
        }
        if (message.type === 'fileDiff') {
          window.dispatchEvent(new MessageEvent('message', { data: {
            type: 'fileDiff',
            hash: message.hash,
            path: message.path,
            diff: synthDiff(message.path)
          } }));
        }
      },
    };
  };

  /*
   * A whole-file diff with one edited line, a deletion and an insertion, so the
   * preview exercises every row kind the real parser can produce - including
   * the word-level spans, which are the fiddliest thing to get right in CSS.
   */
  function synthDiff(path) {
    // A generated file that was reformatted: every line changed, which is the
    // shape that used to put tens of thousands of rows in the DOM at once.
    if (path.indexOf('/Generated/') !== -1) {
      var dense = [];
      for (var d = 1; d <= 20000; d++) {
        dense.push({
          kind: 'change', oldNo: d, newNo: d,
          oldText: '        this.Column' + d + ' = reader.GetString("col_' + d + '");',
          newText: "        this.Column" + d + " = reader.GetString('col_" + d + "');",
          oldSpans: [[44, 45]], newSpans: [[44, 45]]
        });
      }
      return { path: path, binary: false, rows: dense, added: 20000, removed: 20000, changes: 1, truncated: false };
    }

    var rows = [];
    var oldNo = 0;
    var newNo = 0;
    function same(text) {
      oldNo++; newNo++;
      rows.push({ kind: 'same', oldNo: oldNo, newNo: newNo, oldText: text, newText: text });
    }
    for (var i = 0; i < 14; i++) {
      same(i % 4 === 0 ? '' : '        // context line ' + (i + 1) + ' of ' + path.split('/').pop());
    }

    oldNo++; newNo++;
    var before = '        if (!this._defaultVrstePrijema) {';
    var after = '        if (Util.isEmpty(this._defaultVrstePrijema)) {';
    rows.push({
      kind: 'change', oldNo: oldNo, newNo: newNo, oldText: before, newText: after,
      oldSpans: [[12, 13]], newSpans: [[12, 27]]
    });

    for (var j = 0; j < 6; j++) { same('            this._value = ' + j + ';'); }

    oldNo++;
    rows.push({ kind: 'del', oldNo: oldNo, newNo: null, oldText: '        // a line that went away', newText: null });
    newNo++;
    rows.push({ kind: 'add', oldNo: null, newNo: newNo, oldText: null, newText: '        // a line that arrived' });

    for (var k = 0; k < 10; k++) { same('        return this._defaultVrstePrijema;'); }
    rows.push({ kind: 'gap', oldNo: null, newNo: null, oldText: null, newText: null, skipped: 420 });
    oldNo += 420; newNo += 420;
    for (var m = 0; m < 8; m++) { same('    } // tail line ' + (m + 1)); }

    return { path: path, binary: false, rows: rows, added: 2, removed: 2, changes: 2, truncated: false };
  }
</script>
<script src="../media/format.js"></script>
<script src="../media/dom.js"></script>
<script src="../media/virtual.js"></script>
<script src="../media/graphview.js"></script>
<script src="../media/diffview.js"></script>
<script src="../media/syntax.js"></script>
<script src="../media/repo.js"></script>
</body>
</html>
