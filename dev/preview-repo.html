<!DOCTYPE html>
<!--
  Dev harness for the Git Repository window. Loads the real media/repo.css and
  media/repo.js with a stubbed webview API and a captured model, so the commit
  graph can be inspected without launching an Extension Development Host.
  Not shipped as part of the extension's runtime.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Git Repository - preview</title>
<link href="../media/codicon.css" rel="stylesheet">
<link href="../media/shell.css" rel="stylesheet">
<link href="../media/repo.css" rel="stylesheet">
<style>
  /* Approximation of VS Code's Dark Modern tokens. */
  :root {
    --vscode-font-family: "Segoe UI", system-ui, sans-serif;
    --vscode-font-size: 13px;
    --vscode-editor-font-family: Consolas, "Courier New", monospace;
    --vscode-foreground: #cccccc;
    --vscode-editor-background: #1f1f1f;
    --vscode-panel-border: #2b2b2b;
    --vscode-descriptionForeground: #9d9d9d;
    --vscode-input-background: #313131;
    --vscode-input-foreground: #cccccc;
    --vscode-input-border: #3c3c3c;
    --vscode-focusBorder: #0078d4;
    --vscode-textLink-foreground: #4daafc;
    --vscode-textLink-activeForeground: #6cb8ff;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-list-activeSelectionBackground: #04395e;
    --vscode-list-activeSelectionForeground: #ffffff;
    --vscode-badge-background: #0078d4;
    --vscode-badge-foreground: #ffffff;
    --vscode-progressBar-background: #0078d4;
    --vscode-editorGroupHeader-tabsBackground: #181818;
    --vscode-menu-background: #1f1f1f;
    --vscode-menu-foreground: #cccccc;
    --vscode-menu-border: #454545;
    --vscode-menu-selectionBackground: #04395e;
    --vscode-menu-selectionForeground: #ffffff;
    --vscode-menu-separatorBackground: #454545;
    --vscode-symbolIcon-folderForeground: #dcb67a;
  }
</style>
</head>
<body>
<div id="root" class="repo-shell"></div>
<div id="menu" class="context-menu" hidden></div>

<script src="./preview-repo-model.js"></script>
<script>
  // ?rows=N repeats the captured local history until it is N commits long, so
  // row virtualization can be exercised without capturing a huge repository.
  (function () {
    var want = parseInt(new URLSearchParams(location.search).get('rows'), 10);
    if (!want) {
      return;
    }
    var graph = window.__VSG_REPO_MODEL.graph;
    var local = graph.rows.filter(function (r) { return r.group === 'local'; });
    var grown = [];
    for (var i = 0; grown.length < want; i++) {
      var source = local[i % local.length];
      if (i < local.length) {
        grown.push(source);
        continue;
      }
      var clone = JSON.parse(JSON.stringify(source));
      // Unique in the first seven characters, so the short hash in the ID
      // column identifies the row and tools/preview-check.js can tell which
      // commits are on screen.
      clone.commit.hash = ('000000' + i.toString(16)).slice(-7) + clone.commit.hash.slice(7);
      clone.commit.shortHash = clone.commit.hash.slice(0, 7);
      clone.commit.subject = source.commit.subject + ' (' + i + ')';
      // Only the captured rows carry refs and HEAD; cloning those would put the
      // same branch chip on hundreds of commits.
      clone.commit.refs = [];
      clone.isHead = false;
      grown.push(clone);
    }
    graph.rows = graph.rows.filter(function (r) { return r.group === 'incoming'; }).concat(grown);
  })();
</script>
<script>
  /*
   * A menu spec of the shape src/git/branchOps.ts produces. What the real menu
   * offers is settled by tests/branchOps.test.js; what the harness checks here
   * is that a spec of this shape renders - entries, separators, and a disabled
   * entry that says why and does nothing.
   */
  function menusFor(refs) {
    const menus = {};
    for (const ref of refs) {
      menus[ref.short] = [
        { op: 'checkout', label: 'Checkout', icon: 'check',
          disabled: !!ref.current, why: ref.current ? 'Already checked out' : undefined,
          breakAfter: true },
        { op: 'createBranch', label: 'New Local Branch From…', icon: 'git-branch' },
        { op: 'merge', label: "Merge '" + ref.short + "' into 'Test_alpha'", icon: 'git-merge',
          disabled: !!ref.current, why: ref.current ? 'A branch cannot be merged into itself' : undefined },
        { op: 'resetHard', label: 'Reset — Discard Changes (--hard)', breakAfter: true },
        { op: 'viewHistory', label: 'View History', icon: 'history' },
        { op: 'toggleInHistory', label: 'Toggle Branch in History', icon: 'eye' },
        { op: 'newWorktree', label: 'New Worktree From…', icon: 'new-folder' }
      ];
    }
    return menus;
  }

  (function prepareModel() {
    const model = window.__VSG_REPO_MODEL;
    // The captured model predates these fields; the hover card reads them.
    for (const row of model.graph.rows) {
      const c = row.commit;
      const slug = (c.author || 'someone').toLowerCase().replace(/[^a-z]+/g, '.');
      c.authorEmail = c.authorEmail || slug + '@example.com';
      c.committer = c.committer || c.author;
      c.committerEmail = c.committerEmail || slug + '@example.com';
      c.committerDate = c.committerDate || c.date;
    }
    model.graph.extras = model.graph.extras || [];
    model.menus = menusFor(model.refs);
    model.worktrees = model.worktrees || worktrees();
  })();

  /*
   * Two worktrees of the shape src/git/worktrees.ts produces: this one clean,
   * and a linked one holding a file of every letter plus enough untracked noise
   * to reach the cap, so the pane is drawn at its worst rather than its usual.
   */
  function worktrees() {
    var files = [
      { path: 'Mcs.Skzz.Api/Controllers/Api/WidgetSettings/WidgetSettingsController.cs', status: 'M' },
      { path: 'Mcs.Skzz.Api/Controllers/Api/WidgetSettings/WidgetSettingsModel.cs', status: '!' },
      { path: 'Mcs.Skzz.Data/Repositories/WidgetSettingRepository.cs', status: 'A' },
      { path: 'Mcs.Skzz.Common/Helpers/DateHelper.cs', status: 'D' },
      { path: 'Mcs.Medicus.Spa/src/styles/theme.scss', origPath: 'Mcs.Medicus.Spa/src/theme.scss', status: 'R' },
      { path: 'notes.txt', status: 'U' }
    ];
    for (var i = files.length; i < 200; i++) {
      files.push({ path: 'Mcs.Skzz.Data/Generated/File' + ('000' + i).slice(-4) + '.cs', status: 'U' });
    }
    return [
      { path: 'D:/MedicusNet', name: 'MedicusNet', branch: 'Test_alpha', current: true,
        files: [], total: 0, note: 'No changes.' },
      { path: 'D:/MedicusNet-review', name: 'MedicusNet-review', branch: 'NSKZZ-RC', current: false,
        files: files, total: 523 }
    ];
  }

  /*
   * Enough files that the changes tree overflows the details column, which
   * now has the window's whole height: the check that clicking a file keeps
   * the tree's scroll position proves nothing unless the tree scrolls.
   */
  function entities() {
    var files = [];
    for (var i = 1; i <= 40; i++) {
      files.push({ status: 'M', path: 'Mcs.Skzz.Data/Entities/Entity' + ('00' + i).slice(-3) + '.cs' });
    }
    return files;
  }

  let stored = {};
  window.acquireVsCodeApi = function () {
    return {
      getState: function () { return stored; },
      setState: function (next) { stored = next; },
      postMessage: function (message) {
        console.log('[preview] postMessage', message);
        if (message.type === 'openWorktreeChange') {
          window.__VSG_OPENED = message;
        }
        // What the extension would open in VS Code's diff editor, for
        // tools/preview-check.js to read back.
        if (message.type === 'openFileDiff') {
          (window.__VSG_OPENED_DIFFS = window.__VSG_OPENED_DIFFS || []).push(message);
        }
        if (message.type === 'ready' || message.type === 'refresh') {
          window.dispatchEvent(
            new MessageEvent('message', { data: { type: 'model', model: window.__VSG_REPO_MODEL } })
          );
        }
        if (message.type === 'selectCommit') {
          // Synthesize details from the captured row so the pane is usable in
          // the preview; the real thing reads them from git.
          var rows = window.__VSG_REPO_MODEL.graph.rows;
          var row = null;
          for (var i = 0; i < rows.length; i++) {
            if (rows[i].commit.hash === message.hash) { row = rows[i]; break; }
          }
          var c = row && row.commit;
          var slug = c ? c.author.toLowerCase().replace(/[^a-z]+/g, '.') : 'someone';
          window.dispatchEvent(new MessageEvent('message', { data: {
            type: 'commitDetails',
            details: c ? {
              hash: c.hash,
              shortHash: c.shortHash,
              parents: c.parents,
              refs: c.refs,
              author: { name: c.author, email: slug + '@example.com', date: c.date },
              committer: { name: c.author, email: slug + '@example.com', date: c.date },
              subject: c.subject,
              body: 'Preview harness: this body and file list are synthesized.',
              files: [
                { status: 'M', path: 'Mcs.Skzz.Api/Controllers/Api/WidgetSettings/WidgetSettingsController.cs' },
                { status: 'M', path: 'Mcs.Skzz.Api/Controllers/Api/WidgetSettings/WidgetSettingsModel.cs' },
                { status: 'A', path: 'Mcs.Skzz.Data/Repositories/WidgetSettingRepository.cs' },
                { status: 'M', path: 'Mcs.Skzz.Data/Migrations/20260911_AddWidgetSettings.sql' },
                { status: 'D', path: 'Mcs.Skzz.Common/Helpers/DateHelper.cs' },
                { status: 'M', path: 'Mcs.Skzz.Common/Helpers/StringHelper.cs' },
                { status: 'R', path: 'Mcs.Medicus.Spa/src/styles/theme.scss', origPath: 'Mcs.Medicus.Spa/src/theme.scss' },
                { status: 'M', path: 'Mcs.Medicus.Spa/src/business/core/services/SessionVrstePrijema.ts' },
                { status: 'M', path: 'Mcs.Medicus.Spa/src/business/module.common/viewmodels/PosjetNoviViewModel.ts' },
                { status: 'M', path: 'Mcs.Medicus.Spa/src/index.html' },
                { status: 'A', path: 'tools/deploy.py' },
                { status: 'M', path: 'Directory.Build.props' },
                { status: 'M', path: 'package.json' },
                { status: 'M', path: 'Mcs.Skzz.Data/Generated/Model.designer.cs' },
                { status: 'M', path: 'Mcs.Medicus.Spa/dist/bundle.min.js' }
              ].concat(entities()),
              truncated: false,
              isMerge: c.parents.length > 1
            } : null
          } }));
        }
        if (message.type === 'branchOp' && message.op === 'toggleInHistory') {
          var graph = window.__VSG_REPO_MODEL.graph;
          var at = graph.extras.indexOf(message.ref);
          if (at === -1) { graph.extras.push(message.ref); } else { graph.extras.splice(at, 1); }
          window.dispatchEvent(new MessageEvent('message', {
            data: { type: 'model', model: window.__VSG_REPO_MODEL }
          }));
        }
        if (message.type === 'commitMenu') {
          // The shape src/git/commitOps.ts produces. What it offers is settled
          // by tests/commitOps.test.js; the harness checks that it renders.
          window.dispatchEvent(new MessageEvent('message', { data: {
            type: 'commitMenu',
            hash: message.hash,
            entries: [
              { op: 'checkoutDetach', label: 'Checkout (--detach)' },
              { op: 'viewDetails', label: 'View Commit Details', icon: 'git-commit' },
              { op: 'compare', label: 'Compare Commits…', icon: 'diff', breakAfter: true },
              { op: 'newBranch', label: 'New Branch…', icon: 'git-branch' },
              { op: 'newTag', label: 'New Tag…', icon: 'tag', breakAfter: true },
              { op: 'revert', label: 'Revert', disabled: true, why: 'The first commit has nothing to undo against' },
              { op: 'resetHard', label: 'Reset — Discard Changes (--hard)' },
              { op: 'goToParent', label: 'Go to Parent', icon: 'arrow-down', shortcut: 'Alt+PgDn' },
              { op: 'outgoingOnly', label: 'Show Outgoing / Incoming Only', checked: true, breakAfter: true },
              { op: 'newWorktree', label: 'New Worktree From…', icon: 'new-folder' }
            ]
          } }));
        }
      },
    };
  };

</script>
<script src="../media/format.js"></script>
<script src="../media/dom.js"></script>
<script src="../media/virtual.js"></script>
<script src="../media/graphview.js"></script>
<script src="../media/diffview.js"></script>
<script src="../media/repo.js"></script>
</body>
</html>
